# Weekly data refresh: check every official link and cross-check conferences against Wikidata.
# It commits catalog.json (new Wikidata ids, missing first years) and data/refresh/report.json (issues to review) only if they changed.
name: refresh
on:
  schedule: [{ cron: '23 4 * * 1' }]   # UTC, weekly on Monday
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: data-push-refresh, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Refresh
        run: python3 tools/extractors/refresh/extract.py
      - name: Commit if the data changed
        run: |
          if [ -z "$(git status --porcelain -- catalog.json data/refresh)" ]; then echo "No changes"; exit 0; fi
          node --check app.js && node check-catalog.mjs
          git config user.name omshivaprakash
          git config user.email 115216+omshivaprakash@users.noreply.github.com
          git add catalog.json data/refresh
          git commit -m "Refresh conference data"
          for wait in 5 15 30 60; do git pull --rebase && git push && exit 0; sleep $wait; done
          exit 1
