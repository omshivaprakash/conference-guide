name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate app and data
        run: node --check app.js && node check-catalog.mjs && python3 tools/extractors/refresh/extract.py selftest && python3 tools/extractors/photos/extract.py selftest
